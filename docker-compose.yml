services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pruuf-display-method-editor
    ports:
      - "5555:5555"
    environment:
      - NODE_ENV=production
      - PORT=5555
      # DigitalOcean Spaces Configuration
      - SPACES_ACCESS_KEY=${SPACES_ACCESS_KEY}
      - SPACES_SECRET_KEY=${SPACES_SECRET_KEY}
      - SPACES_BUCKET=${SPACES_BUCKET}
      - SPACES_REGION=${SPACES_REGION}
      - SPACES_ENDPOINT=${SPACES_ENDPOINT}
      - SPACES_CDN_ENDPOINT=${SPACES_CDN_ENDPOINT}
      # Public IPFS Gateway
      - PUBLIC_IPFS_GATEWAY=${PUBLIC_IPFS_GATEWAY:-https://ipfs.pruuf.tech/ipfs/}
      # Authentication
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:5555}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # Admin Credentials
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5555/api/auth', (r) => {process.exit(r.statusCode === 200 || r.statusCode === 401 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

